name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Check the tag matches the wheel version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          wheel_version=$(grep -m1 '^version' bindings/python/pyproject.toml | cut -d'"' -f2)
          tag_version=${GITHUB_REF_NAME#v}
          if [ "$tag_version" != "$wheel_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match wheel version $wheel_version" >&2
            exit 1
          fi

      - uses: PyO3/maturin-action@v1
        with:
          command: build
          working-directory: bindings/python
          args: --release --features vendored-openssl --out dist
          manylinux: "2_28"
          rust-toolchain: "1.90"
          sccache: "true"
          before-script-linux: |
            yum install -y wget unzip gcc gcc-c++ perl-core make
            (cd /tmp && \
             wget -q https://github.com/protocolbuffers/protobuf/releases/download/v32.0/protoc-32.0-linux-x86_64.zip && \
             unzip -q -o protoc-32.0-linux-x86_64.zip -d /usr/local && \
             rm protoc-32.0-linux-x86_64.zip)
            protoc --version

      - name: Check the wheel metadata
        run: |
          pip install --quiet twine
          twine check --strict bindings/python/dist/*

      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install --quiet bindings/python/dist/*.whl
          /tmp/wheelcheck/bin/python - <<'PY'
          import argparse
          import sglang_router
          from sglang_router import sglang_router_rs
          from sglang_router.launch_router import RouterArgs
          parser = argparse.ArgumentParser()
          RouterArgs.add_cli_args(parser, use_router_prefix=True, exclude_host_port=True)
          assert sglang_router_rs.__file__
          print("ok", sglang_router.__version__)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: bindings/python/dist/*.whl

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: bindings/python/dist/*.whl
          generate_release_notes: true
